<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="100%" height="100%">
  <defs>
    <!-- Globe Gradients -->
    <radialGradient id="globeSphere" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="35%" stop-color="#1e73be" />
      <stop offset="70%" stop-color="#0d47a1" />
      <stop offset="100%" stop-color="#062557" />
    </radialGradient>

    <radialGradient id="globeHighlight" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- M Ribbon Gradient -->
    <linearGradient id="mRibbonGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="30%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- 3D Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e64c8" />
      <stop offset="45%" stop-color="#12499c" />
      <stop offset="55%" stop-color="#0d3575" />
      <stop offset="100%" stop-color="#082250" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Group for Logo Mark -->
  <g transform="translate(0, 15)">
    <!-- Globe Outer Glow / Shadow -->
    <circle cx="300" cy="225" r="160" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.3" filter="url(#shadowFilter)" />

    <!-- 3D Globe Base Sphere -->
    <circle cx="300" cy="225" r="155" fill="url(#globeSphere)" />

    <!-- Globe Grid: Latitudes -->
    <!-- Equator -->
    <ellipse cx="300" cy="225" rx="155" ry="32" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.75" />
    <!-- Latitudes North -->
    <ellipse cx="300" cy="180" rx="146" ry="26" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.65" />
    <ellipse cx="300" cy="135" rx="120" ry="20" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.55" />
    <ellipse cx="300" cy="98" rx="78" ry="12" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.45" />
    <!-- Latitudes South -->
    <ellipse cx="300" cy="270" rx="146" ry="26" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.65" />
    <ellipse cx="300" cy="315" rx="120" ry="20" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.55" />
    <ellipse cx="300" cy="352" rx="78" ry="12" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.45" />

    <!-- Globe Grid: Longitudes -->
    <!-- Prime Meridian (center) -->
    <ellipse cx="300" cy="225" rx="0.1" ry="155" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" />
    <!-- Longitudes East & West -->
    <ellipse cx="300" cy="225" rx="55" ry="155" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.7" />
    <ellipse cx="300" cy="225" rx="105" ry="155" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.7" />
    <ellipse cx="300" cy="225" rx="138" ry="155" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.65" />

    <!-- Inner Core Mini-Globe/Node -->
    <circle cx="300" cy="225" r="28" fill="#1d4ed8" opacity="0.85" stroke="#93c5fd" stroke-width="2" />
    <circle cx="295" cy="220" r="10" fill="#ffffff" opacity="0.5" />

    <!-- Globe Specular Highlight -->
    <circle cx="300" cy="225" r="155" fill="url(#globeHighlight)" />

    <!-- Stylized 3D Crest "M" Ribbon -->
    <!-- Shadow for M ribbon -->
    <path d="M 152 400 
             C 105 320, 115 170, 205 95 
             C 240 65, 275 110, 300 170 
             C 325 110, 360 65, 395 95 
             C 485 170, 495 320, 448 400
             C 440 375, 435 340, 438 310
             C 448 235, 420 150, 370 120
             C 340 100, 320 135, 300 195
             C 280 135, 260 100, 230 120
             C 180 150, 152 235, 162 310
             C 165 340, 160 375, 152 400 Z"
          fill="#000000" opacity="0.3" filter="url(#shadowFilter)" transform="translate(0, 4)" />

    <!-- Main M Ribbon Body -->
    <path d="M 152 400 
             C 105 320, 115 170, 205 95 
             C 240 65, 275 110, 300 170 
             C 325 110, 360 65, 395 95 
             C 485 170, 495 320, 448 400
             C 440 375, 435 340, 438 310
             C 448 235, 420 150, 370 120
             C 340 100, 320 135, 300 195
             C 280 135, 260 100, 230 120
             C 180 150, 152 235, 162 310
             C 165 340, 160 375, 152 400 Z"
          fill="url(#mRibbonGrad)" stroke="#60a5fa" stroke-width="2" />

    <!-- M Left Wing Arrow Tip -->
    <polygon points="152,400 135,420 162,410" fill="#1d4ed8" stroke="#93c5fd" stroke-width="1.5" />

    <!-- M Right Wing Dispersed Digital Pixels -->
    <rect x="445" y="380" width="14" height="14" fill="#3b82f6" rx="1.5" opacity="0.9" />
    <rect x="465" y="365" width="12" height="12" fill="#2563eb" rx="1.5" opacity="0.85" />
    <rect x="440" y="405" width="10" height="10" fill="#60a5fa" rx="1.5" opacity="0.8" />
    <rect x="425" y="415" width="12" height="12" fill="#1d4ed8" rx="1.5" opacity="0.9" />
    <rect x="405" y="425" width="9" height="9" fill="#3b82f6" rx="1" opacity="0.75" />
    <rect x="458" y="400" width="8" height="8" fill="#93c5fd" rx="1" opacity="0.85" />
    <rect x="475" y="385" width="9" height="9" fill="#60a5fa" rx="1" opacity="0.7" />
  </g>

  <!-- Institutional Typography -->
  <g transform="translate(300, 505)" text-anchor="middle">
    <!-- "MAHENDRA" in bold 3D Metallic lettering -->
    <!-- 3D Bevel/Extrusion Layers -->
    <text x="0" y="2" font-family="'Arial Black', 'Impact', 'Montserrat', sans-serif" font-size="64" font-weight="900" letter-spacing="4" fill="#061c40" opacity="0.7">
      MAHENDRA
    </text>
    <text x="0" y="0" font-family="'Arial Black', 'Impact', 'Montserrat', sans-serif" font-size="64" font-weight="900" letter-spacing="4" fill="url(#textGrad)" stroke="#93c5fd" stroke-width="0.75" filter="url(#textShadow)">
      MAHENDRA
    </text>

    <!-- Underline Bar -->
    <line x1="-285" y1="16" x2="285" y2="16" stroke="#000000" stroke-width="3" stroke-linecap="square" />

    <!-- "EDUCATIONAL INSTITUTIONS" -->
    <text x="0" y="52" font-family="'Arial Black', 'Montserrat', sans-serif" font-size="28" font-weight="900" letter-spacing="4.5" fill="#111827">
      EDUCATIONAL INSTITUTIONS
    </text>

    <!-- "SINCE 1978" -->
    <text x="0" y="94" font-family="'Arial Black', 'Montserrat', sans-serif" font-size="25" font-weight="900" letter-spacing="4" fill="#1f2937">
      SINCE 1978
    </text>
  </g>
</svg>
